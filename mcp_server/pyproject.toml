[project]
name = "mediacrawler-mcp"
version = "0.1.0"
description = "Claude Code MCP server for the MediaCrawler checkout it lives in"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2.3,<3",
  "psutil>=6,<8",
]

[project.scripts]
mediacrawler-mcp = "mc_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

# Having a [tool.uv] table stops uv from inheriting the parent MediaCrawler
# project's mirror index.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
